services:
  - type: web
    name: saams
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --threads 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: run:app
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: MENTOR_EMAIL
        sync: false
      - key: MENTOR_WHITELIST_EMAILS
        sync: false
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: MAIL_TIMEOUT
        value: "6"
      - key: FORCE_SMTP
        value: "false"
      - key: DB_POOL_MODE
        value: "null"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: saams-production
          property: connectionString

databases:
  - name: saams-production
    databaseName: saams_db
    user: saams_user
    plan: free
